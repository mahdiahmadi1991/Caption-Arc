name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      WXT_CHROME_EXTENSION_KEY_PRODUCTION: ${{ secrets.WXT_CHROME_EXTENSION_KEY_PRODUCTION }}
      WXT_FIREFOX_EXTENSION_ID_PRODUCTION: ${{ secrets.WXT_FIREFOX_EXTENSION_ID_PRODUCTION }}
      WXT_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.WXT_GOOGLE_OAUTH_CLIENT_ID }}
      WXT_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.WXT_GOOGLE_OAUTH_CLIENT_SECRET }}
      WXT_GOOGLE_OAUTH_CLIENT_ID_CHROME: ${{ secrets.WXT_GOOGLE_OAUTH_CLIENT_ID_CHROME }}
      WXT_GOOGLE_OAUTH_CLIENT_SECRET_CHROME: ${{ secrets.WXT_GOOGLE_OAUTH_CLIENT_SECRET_CHROME }}
      WXT_GOOGLE_OAUTH_CLIENT_ID_FIREFOX: ${{ secrets.WXT_GOOGLE_OAUTH_CLIENT_ID_FIREFOX }}
      WXT_GOOGLE_OAUTH_CLIENT_SECRET_FIREFOX: ${{ secrets.WXT_GOOGLE_OAUTH_CLIENT_SECRET_FIREFOX }}
      WXT_MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.WXT_MICROSOFT_OAUTH_CLIENT_ID }}
      WXT_MICROSOFT_OAUTH_CLIENT_ID_CHROME: ${{ secrets.WXT_MICROSOFT_OAUTH_CLIENT_ID_CHROME }}
      WXT_MICROSOFT_OAUTH_CLIENT_ID_FIREFOX: ${{ secrets.WXT_MICROSOFT_OAUTH_CLIENT_ID_FIREFOX }}
      WXT_MICROSOFT_OAUTH_TENANT: ${{ secrets.WXT_MICROSOFT_OAUTH_TENANT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Validate release configuration
        run: pnpm release:validate

      - name: Package Chrome production artifact
        run: pnpm package:target:chrome

      - name: Package Firefox production artifact
        run: pnpm package:target:firefox

      - name: List output files
        run: |
          set -euo pipefail
          echo "=== .release directory ==="
          ls -la .release/ || echo "No .release directory"
          echo "=== Find all zip files ==="
          find .release -name "*.zip" -type f
          test -n "$(find ".release/v${{ steps.version.outputs.VERSION }}/production/chrome" -name '*.zip' -type f -print -quit)"
          test -n "$(find ".release/v${{ steps.version.outputs.VERSION }}/production/firefox" -name '*.zip' -type f -print -quit)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CaptionArc v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          append_body: false
          files: |
            .release/v${{ steps.version.outputs.VERSION }}/production/chrome/*.zip
            .release/v${{ steps.version.outputs.VERSION }}/production/firefox/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
