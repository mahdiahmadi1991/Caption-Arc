name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build Chrome production artifact
        run: pnpm build:chrome:production

      - name: Build Firefox production artifact
        run: pnpm build:firefox:production

      - name: Package Chrome production artifact
        run: pnpm zip:chrome:production

      - name: Package Firefox production artifact
        run: pnpm zip:firefox:production

      - name: List output files
        run: |
          set -euo pipefail
          echo "=== .release directory ==="
          ls -la .release/ || echo "No .release directory"
          echo "=== Find all zip files ==="
          find .release -name "*.zip" -type f
          test -n "$(find .release/chrome/production -name '*.zip' -type f -print -quit)"
          test -n "$(find .release/firefox/production -name '*.zip' -type f -print -quit)"

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: CaptionArc v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          append_body: false
          files: |
            .release/chrome/production/*.zip
            .release/firefox/production/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
