name: Docs Guardrails

on:
  pull_request:
  push:

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate documentation contract
        run: node ./scripts/docs/validate-docs.mjs
