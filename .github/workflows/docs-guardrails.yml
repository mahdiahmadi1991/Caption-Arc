name: Docs Guardrails

on:
  pull_request:
  push:
    tags-ignore:
      - "v*"

jobs:
  docs-check:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): update develop preview to ') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate documentation contract
        run: node ./scripts/docs/validate-docs.mjs

      - name: Validate business documentation sync
        env:
          BUSINESS_DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BUSINESS_DOCS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node ./scripts/docs/validate-business-docs-sync.mjs

      - name: Validate behavior-contract sync
        env:
          BEHAVIOR_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BEHAVIOR_CONTRACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node ./scripts/docs/validate-behavior-contract-sync.mjs
