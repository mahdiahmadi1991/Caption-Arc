name: CI

on:
  pull_request:
    paths:
      - "entrypoints/**"
      - "tests/**"
      - "scripts/testing/**"
      - "scripts/release/**"
      - "scripts/i18n/**"
      - "scripts/manual-smoke/**"
      - "scripts/start-windows-chrome-debug.sh"
      - "vitest.config.ts"
      - "wxt.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/quality-gates.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-train.yml"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
  push:
    branches:
      - develop
      - main
    tags-ignore:
      - "v*"
    paths:
      - "entrypoints/**"
      - "tests/**"
      - "scripts/testing/**"
      - "scripts/release/**"
      - "scripts/i18n/**"
      - "scripts/manual-smoke/**"
      - "scripts/start-windows-chrome-debug.sh"
      - "vitest.config.ts"
      - "wxt.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"

jobs:
  docs-check:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): update develop preview to ') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate documentation contract
        run: node ./scripts/docs/validate-docs.mjs

      - name: Validate business documentation sync
        env:
          BUSINESS_DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BUSINESS_DOCS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node ./scripts/docs/validate-business-docs-sync.mjs

      - name: Validate behavior-contract sync
        env:
          BEHAVIOR_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BEHAVIOR_CONTRACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node ./scripts/docs/validate-behavior-contract-sync.mjs

  quality-checks:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release): update develop preview to ') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate documentation contract
        run: pnpm docs:check

      - name: Validate shipped locale catalog sync
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm i18n:check -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
          else
            pnpm i18n:check -- --base "${{ github.event.before }}" --head "${{ github.sha }}"
          fi

      - name: Validate conventional commit history
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm release:commits:check -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
          else
            pnpm release:commits:check -- --base "${{ github.event.before }}" --head "${{ github.sha }}"
          fi

      - name: Run contract test suite
        run: pnpm test:google

      - name: Run coverage report
        run: pnpm test:google:coverage

      - name: Build Chrome production artifact
        run: pnpm build:target:chrome:production

      - name: Build Firefox production artifact
        run: pnpm build:target:firefox:production
